version: '3.9'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --reload
    develop:
      watch:
        - action: sync
          path: .
          target: /app

  tests:
    build: .
    volumes:
      - .:/app
    command: pytest tests/ -v --asyncio-mode=auto
    depends_on:
      - app
