{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Edit Community</h1>

    <form method="post" action="/communities/{{ community.id }}/edit" class="space-y-4">
        <div class="form-control">
            <label class="label"><span class="label-text">Name</span></label>
            <input type="text" name="name" value="{{ community.name }}" class="input input-bordered w-full" required />
        </div>
        <div class="form-control">
            <label class="label"><span class="label-text">Description</span></label>
            <textarea name="description" class="textarea textarea-bordered w-full" required>{{ community.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
