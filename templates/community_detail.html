{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-2">{{ community.name }}</h1>
    <p class="text-lg opacity-80 mb-6">{{ community.description }}</p>

    {% if community.events %}
    <h2 class="text-2xl font-bold mb-4">Events</h2>
    <div class="grid gap-4 md:grid-cols-2">
        {% for event in community.events %}
        <div class="card bg-base-100 shadow-md">
            <div class="card-body">
                <h3 class="card-title">{{ event.title }}</h3>
                <p>{{ event.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endblock %}
