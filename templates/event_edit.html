{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Edit Event</h1>

    <form method="post" action="/events/{{ event.id }}/edit" class="space-y-4">
        <div class="form-control">
            <label class="label"><span class="label-text">Title</span></label>
            <input type="text" name="title" value="{{ event.title }}" class="input input-bordered w-full" required />
        </div>
        <div class="form-control">
            <label class="label"><span class="label-text">Description</span></label>
            <textarea name="description" class="textarea textarea-bordered w-full" required>{{ event.description }}</textarea>
        </div>
        <div class="form-control">
            <label class="label"><span class="label-text">Category</span></label>
            <input type="text" name="category" value="{{ event.category }}" class="input input-bordered w-full" required />
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="form-control">
                <label class="label"><span class="label-text">Latitude</span></label>
                <input type="number" step="any" name="latitude" value="{{ event.latitude }}" class="input input-bordered w-full" required />
            </div>
            <div class="form-control">
                <label class="label"><span class="label-text">Longitude</span></label>
                <input type="number" step="any" name="longitude" value="{{ event.longitude }}" class="input input-bordered w-full" required />
            </div>
        </div>
        <div class="form-control">
            <label class="label"><span class="label-text">Location Name</span></label>
            <input type="text" name="location_name" value="{{ event.location_name }}" class="input input-bordered w-full" required />
        </div>
        <div class="form-control">
            <label class="label"><span class="label-text">Date & Time</span></label>
            <input type="datetime-local" name="date_time" class="input input-bordered w-full" required />
        </div>
        <div class="form-control">
            <label class="label"><span class="label-text">Capacity Limit</span></label>
            <input type="number" name="capacity_limit" value="{{ event.capacity_limit or '' }}" class="input input-bordered w-full" />
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
