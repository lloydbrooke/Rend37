{% extends "base.html" %}

{% block content %}
<div class="grid min-h-screen place-items-center px-4">
    <div class="w-full max-w-sm rounded-xl bg-base-200 p-8 shadow-xl border border-base-content/10">
        <h2 class="mb-6 text-center text-2xl font-bold tracking-tight text-base-content">Sign in to your account</h2>

        {% if success_msg %}
            <div class="alert alert-success mb-4" role="alert">
                <p class="text-sm font-medium">{{ success_msg }}</p>
            </div>
        {% endif %}

        {% if error %}
            <div class="alert alert-error mb-4" role="alert">
                <p class="text-sm font-medium">{{ error }}</p>
            </div>
        {% endif %}

        <form action="/auth/login" method="post" class="space-y-4">
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div>
                <label class="block text-sm font-medium text-base-content/70 mb-1">Username</label>
                <input type="text" name="username" required
                    class="input input-bordered w-full text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-base-content/70 mb-1">Password</label>
                <input type="password" name="password" required
                    class="input input-bordered w-full text-sm">
            </div>

            <button type="submit" class="btn btn-primary w-full">Sign In</button>
        </form>

        <p class="mt-6 text-center text-sm text-base-content/60">
            Don't have an account?
            <a href="/auth/register{% if next %}?next={{ next }}{% endif %}" class="font-semibold text-primary hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
