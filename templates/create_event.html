{% extends "base.html" %}

{% block content %}
<style>
  select[name="community_id"] option {
    background: #2a2a35;
    color: inherit;
  }
</style>

<div class="max-w-4xl mx-auto px-4 py-10">
  <div class="rounded-2xl p-8" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.15);">

    <h2 class="text-2xl font-bold text-base-content mb-6">Create event</h2>
    <p class="text-sm text-base-content/50 mb-6">Fill in the details below to publish a new event to your community.</p>

    <form method="post" action="/events/create" class="space-y-5">

      <div class="form-control">
        <label class="label pb-1"><span class="label-text text-sm">Community</span></label>
        <select class="select select-bordered select-sm w-full" style="background: rgba(255,255,255,0.07); color: inherit;" name="community_id" required>
          <option disabled selected value="">Select a community</option>
          {% for community in communities %}
            <option value="{{ community.id }}">{{ community.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="divider my-2"></div>

      <div class="form-control">
        <label class="label pb-1"><span class="label-text text-sm">Title</span></label>
        <input class="input input-bordered input-sm w-full" style="background: rgba(255,255,255,0.07);" type="text" name="title" placeholder="Give your event a name" required />
      </div>

      <div class="form-control">
        <label class="label pb-1"><span class="label-text text-sm">Description</span></label>
        <textarea class="textarea textarea-bordered w-full text-sm leading-relaxed" style="background: rgba(255,255,255,0.07);" name="description" placeholder="What's this event about?" rows="4" required></textarea>
      </div>

      <div class="form-control">
        <label class="label pb-1"><span class="label-text text-sm">Category</span></label>
        <input class="input input-bordered input-sm w-full" style="background: rgba(255,255,255,0.07);" type="text" name="category" placeholder="e.g. Workshop, Social, Meetup" required />
      </div>

      <div class="divider my-2"></div>

      <p class="text-xs font-medium tracking-widest uppercase text-base-content/30">Location</p>

      <div class="form-control">
        <label class="label pb-1"><span class="label-text text-sm">Location name</span></label>
        <input class="input input-bordered input-sm w-full" style="background: rgba(255,255,255,0.07);" type="text" name="location_name" placeholder="e.g. The Old Vic, Room 4B" required />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="form-control">
          <label class="label pb-1"><span class="label-text text-sm">Latitude</span></label>
          <input class="input input-bordered input-sm w-full" style="background: rgba(255,255,255,0.07);" type="number" step="any" name="latitude" placeholder="51.5074" required />
        </div>
        <div class="form-control">
          <label class="label pb-1"><span class="label-text text-sm">Longitude</span></label>
          <input class="input input-bordered input-sm w-full" style="background: rgba(255,255,255,0.07);" type="number" step="any" name="longitude" placeholder="-0.1278" required />
        </div>
      </div>
      <p class="text-xs text-base-content/40 mb-6">Tip: right-click any point on Google Maps to copy coordinates.</p>

      <div class="divider my-2"></div>

      <p class="text-xs font-medium tracking-widest uppercase text-base-content/30">Details</p>

      <div class="grid grid-cols-2 gap-4">
        <div class="form-control">
          <label class="label pb-1"><span class="label-text text-sm">Date &amp; time</span></label>
          <input class="input input-bordered input-sm w-full" style="background: rgba(255,255,255,0.07);" type="datetime-local" name="date_time" required />
        </div>
        <div class="form-control">
          <label class="label pb-1"><span class="label-text text-sm">Capacity limit</span></label>
          <input class="input input-bordered input-sm w-full" style="background: rgba(255,255,255,0.07);" type="number" name="capacity_limit" placeholder="50" min="1" required />
        </div>
      </div>

      <button type="submit" class="btn btn-neutral w-full mt-4">Create event</button>

    </form>
  </div>
</div>
{% endblock %}
