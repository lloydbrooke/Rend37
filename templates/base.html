<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REND37</title>
    <link href="{{ url_for('static', path='css/main.css') }}" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <div class="drawer lg:drawer-open">
  <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content">
    <!-- Navbar -->
    <nav class="navbar w-full bg-base-300">
      <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost">
        <!-- Sidebar toggle icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path><path d="M9 4v16"></path><path d="M14 10l2 2l-2 2"></path></svg>
      </label>
      
        <div class="flex flex-1 flex-row justify-between items-center px-4">

            <div class="flex text-3xl font-bold">REND37</div>

            <div class="flex">
              <input class="input input-bordered " type="text" placeholder="Search...">
            </div>

            <div class="flex">
              {% if user %}
                <span class="mr-2 self-center text-sm">{{ user.username }}</span>
                <a href="/auth/logout" class="btn btn-ghost">Logout</a>
              {% else %}
                <a href="/auth/login" class="btn btn-ghost">Login</a>
              {% endif %}
            </div>

        </div>


    </nav>
    <!-- Page content here -->
    <div class="p-4">
        {% block content %}
        {% endblock content %}
    </div>
  </div>

  <div class="drawer-side is-drawer-close:overflow-visible">
    <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
    <div class="flex min-h-full flex-col items-start bg-base-200 is-drawer-close:w-14 is-drawer-open:w-64">
      <!-- Sidebar content here -->
      <ul class="menu w-full grow">
        <!-- Map -->
        <li>
          <a href="/map">
            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Map">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"></path><path d="M9 4v13"></path><path d="M15 7v13"></path></svg>
              <span class="is-drawer-close:hidden">Map</span>
            </button>
          </a>
        </li>

        <!-- Communities -->
        <li>
          <a href="/communities">
            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Communities">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <span class="is-drawer-close:hidden">Communities</span>
            </button>
          </a>
        </li>

        <!-- Events -->
        <li>
          <a href="/events">
            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Events">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              <span class="is-drawer-close:hidden">Events</span>
            </button>
          </a>
        </li>

        <!-- Account -->
        <li>
          <a href="{{ url_for('get_profile') }}">
            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Account">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span class="is-drawer-close:hidden">Account</span>
            </button>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
