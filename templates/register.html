{% extends "base.html" %}

{% block content %}
<div class="grid min-h-screen place-items-center bg-gray-50 px-4">
    <div class="w-full max-w-sm rounded-xl bg-white p-8 shadow-2xl">
        <h2 class="mb-6 text-center text-2xl font-bold tracking-tight text-gray-900">Create your account</h2>

        {% if error %}
            <div class="mb-4 rounded-md bg-red-50 p-4 border-l-4 border-red-500" role="alert">
                <p class="text-sm text-red-700 font-medium">
                    <span class="font-bold">Error:</span> {{ error }}
                </p>
            </div>
        {% endif %}

        <form action="/auth/register" method="post" class="space-y-4">
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required
                    class="input input-bordered w-full text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" required
                    class="input input-bordered w-full text-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="input input-bordered w-full text-sm">
            </div>
            
            <button type="submit" 
                class="flex w-full justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-all">
                Create Account
            </button>
        </form>
        
        <p class="mt-6 text-center text-sm text-gray-500">
            Already have an account? 
            <a href="/auth/login{% if next %}?next={{ next }}{% endif %}" class="font-semibold text-blue-600 hover:text-blue-500 transition-colors">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
