<form method="post" action="/events/{{ event.id }}/edit">

    <input type="text" name="title" value="{{ event.title }}" />

    <textarea name="description">{{ event.description }}</textarea>

    <input type="text" name="category" value="{{ event.category }}" />

    <input type="text" name="location_name" value="{{ event.location_name }}" />

    <input type="number" step="any" name="latitude" value="{{ event.latitude }}" />

    <input type="number" step="any" name="longitude" value="{{ event.longitude }}" />

    <input type="datetime-local" name="date_time"
           value="{{ event.date_time.strftime('%Y-%m-%dT%H:%M') }}" />

    <input type="number" name="capacity_limit" value="{{ event.capacity_limit }}" />

    <input type="hidden" name="community_id" value="{{ event.community_id }}" />

    <button type="submit">Update Event</button>

</form>
