 

    <!-- REGISTER BUTTON -->
    <div id="register-btn-{{ event.id }}">
        {% if error %}
            <p class="text-error text-sm mb-2">{{ error }}</p>
        {% endif %}
        {% if is_registered %}
            <button
                hx-post="/events/{{ event.id }}/unregister"
                hx-target="#register-btn-{{ event.id }}"
                hx-swap="outerHTML"
                class="btn btn-outline btn-primary">
                Unregister
            </button>
        {% else %}
            <button
                hx-post="/events/{{ event.id }}/register"
                hx-target="#register-btn-{{ event.id }}"
                hx-swap="outerHTML"
                class="btn btn-outline btn-primary">
                Register
            </button>
        {% endif %}
    </div>

{% if attendee_count is defined %}
<p id="attendee-count" hx-swap-oob="true">👥 {{ attendee_count }} / {{ event.capacity_limit }} spots taken</p>
{% endif %}
